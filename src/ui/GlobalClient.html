  function setButtonLoading(buttonOrId, loading, label) {
    const button = typeof buttonOrId === 'string'
      ? document.getElementById(buttonOrId)
      : buttonOrId;

    if (!button) return;

    if (loading) {
      if (!button.dataset.originalHtml) {
        button.dataset.originalHtml = button.innerHTML;
      }
      button.disabled = true;
      button.classList.add('is-loading');
      button.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span><span>' +
        escapeHtml(label || 'Procesando...') +
        '</span>';
      return;
    }

    button.disabled = false;
    button.classList.remove('is-loading');
    if (button.dataset.originalHtml) {
      button.innerHTML = button.dataset.originalHtml;
      delete button.dataset.originalHtml;
    }
  }

  function showView(id) {
    document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });

  }
  function filterRowsByQuery(rows, query) {
    if (!query) return rows;

    return (rows || []).filter(function(row) {
      return Object.values(row.values || row).some(function(value) {
        return String(value || '').toLowerCase().includes(query);
      });
    });
  }

  function renderSimpleTable(tableId, headers, rows) {
    const table = document.getElementById(tableId);
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');
    const visibleHeaders = headers || [];

    thead.innerHTML = '<tr>' +
      visibleHeaders.map(function(header) { return '<th>' + escapeHtml(header) + '</th>'; }).join('') +
      '</tr>';
    tbody.innerHTML = '';

    (rows || []).forEach(function(row) {
      const values = row.values || {};
      const tr = document.createElement('tr');
      tr.innerHTML = visibleHeaders.map(function(header) {
        return '<td>' + escapeHtml(values[header] || '') + '</td>';
      }).join('');
      tbody.appendChild(tr);
    });
  }
  function canonicalAssetType(value) {
    const text = upperValue(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
    const aliases = {
      'PC PORTATIL': 'PC-PORTÁTIL',
      'PC-PORTATIL': 'PC-PORTÁTIL',
      'LAPTOP': 'PC-PORTÁTIL',
      'PORTATIL': 'PC-PORTÁTIL',
      'PC ESCRITORIO': 'PC-ESCRITORIO',
      'PC-ESCRITORIO': 'PC-ESCRITORIO',
      'DESKTOP': 'PC-ESCRITORIO',
      'SMARTPHONE': 'SMARTPHONE',
      'CELULAR': 'SMARTPHONE',
      'IMPRESORA': 'IMPRESORA',
      'ESCANER': 'ESCÁNER',
      'ESCÁNER': 'ESCÁNER',
      'SCANNER': 'ESCÁNER',
      'MONITOR': 'MONITOR'
    };

    return aliases[text] || (ASSET_TYPES.indexOf(value) !== -1 ? value : '');
  }

  function isComputerType(type) {
    const canonical = canonicalAssetType(type);
    return canonical === 'PC-PORTÁTIL' || canonical === 'PC-ESCRITORIO';
  }

  function isNaValue(value) {
    const text = upperValue(value).replace(/\s+/g, '');
    return text === 'N/A' || text === 'NA';
  }

  function upperValue(value) {
    return String(value || '').replace(/\r?\n/g, ' ').trim().toUpperCase();
  }

  function normalizeDateText(value) {
    const text = String(value || '').trim();
    if (!text) return '';
    if (isNaValue(text)) return 'N/A';

    const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (iso) return iso[3] + '/' + iso[2] + '/' + iso[1];

    const slash = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (slash) return slash[1].padStart(2, '0') + '/' + slash[2].padStart(2, '0') + '/' + slash[3];

    return upperValue(text);
  }

  function showStatus(id, type, message) {
    const el = document.getElementById(id);
    if (!el) return;
    el.className = 'status ' + type;
    el.textContent = message;
  }

  function escapeHtml(str) {
    return String(str || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttr(str) {
    return String(str || '')
      .replaceAll('\\', '\\\\')
      .replaceAll("'", "\\'")
      .replaceAll('"', '&quot;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');
  }
